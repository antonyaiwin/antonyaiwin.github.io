<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- SEO Optimization -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Antony Aiwin - Flutter Developer with expertise in creating responsive, performant, and visually appealing mobile applications using Flutter.">
  <meta name="keywords"
    content="Flutter Developer, Antony Aiwin, Mobile App Development, Flutter Portfolio, Android, iOS, Web Development, Antony Aiwin Flutter">

  <!-- Open Graph Tags -->
  <meta property="og:title" content="Antony Aiwin - Flutter Developer">
  <meta property="og:description"
    content="Antony Aiwin - Flutter Developer with expertise in creating responsive, performant, and visually appealing mobile applications using Flutter.">
  <meta property="og:image" content="https://antonyaiwin.web.app/icons/og-image.jpg">
  <meta property="og:url" content="https://antonyaiwin.web.app">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_personal_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Antony Aiwin - Flutter Developer</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      display: flex;
      background-color:
        /* #0A192F */
        #000000;
      height: 100vh;
      margin: 0;
    }

    /* Basic reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    /* Fullscreen splash container */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      /* Pure black background */
      color: white;
      z-index: 9999;
      -webkit-font-smoothing: antialiased;
      transition: opacity .45s ease, transform .45s ease;
    }

    /* Center card */
    .card {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      padding: 28px 34px;
      min-width: 260px;
      max-width: 90%;
      text-align: center
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: Inter, system-ui, Segoe UI, Roboto, "Helvetica Neue", Arial;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.4px
    }

    /* Animated dot loader */
    .loader {
      display: flex;
      gap: 8px;
      margin-top: 6px
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
      opacity: .18;
      transform: translateY(0);
      animation: dot 1s infinite
    }

    .dot:nth-child(1) {
      animation-delay: 0s
    }

    .dot:nth-child(2) {
      animation-delay: .12s
    }

    .dot:nth-child(3) {
      animation-delay: .24s
    }

    @keyframes dot {
      0% {
        opacity: .18;
        transform: translateY(0)
      }

      40% {
        opacity: 1;
        transform: translateY(-10px)
      }

      80% {
        opacity: .18;
        transform: translateY(0)
      }

      100% {
        opacity: .18;
        transform: translateY(0)
      }
    }

    /* Small caption */
    .caption {
      font-size: 13px;
      opacity: .75
    }

    /* Fade-out classes: used when hiding splash */
    #splash.fade-out {
      opacity: 0;
      transform: scale(.98);
      pointer-events: none
    }

    /* Hide utility — for progressive enhancement */
    .hidden {
      display: none !important
    }

    /* Responsive tweaks */
    @media (max-width:420px) {
      .brand {
        font-size: 16px
      }
    }
  </style>
</head>

<body>
  <!-- Splash container: keep this at the very top of your <body> (before the Flutter mount node) -->
  <div id="splash" aria-hidden="false">
    <div class="card" role="status" aria-live="polite">
      <div class="brand">
        <div>
          <div style="font-size:15px">Antony Aiwin</div>
          <div style="font-size:12px;opacity:.7">Flutter Web Portfolio</div>
        </div>
      </div>

      <div class="loader" aria-hidden="true">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="caption">Preparing the portfolio... <span aria-hidden="true">✨</span></div>
    </div>
  </div>

  <script>
    // Expose a simple global function that Flutter can call when it's ready.
    window.hideSplash = function () {
      try {
        const s = document.getElementById('splash');
        if (!s) return;
        s.classList.add('fade-out');
        setTimeout(() => {
          if (s && s.parentNode) s.parentNode.removeChild(s);
        }, 600);
      } catch (e) { console.warn('hideSplash error', e) }
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
